# example netlify.toml
[build]
  command = "NODE_OPTIONS='--max-old-space-size=3584' vite build"
  functions = "netlify/functions"
  publish = "dist"

## Uncomment to use this redirect for Single Page Applications
## Not needed for static site generators.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change content under the same filename, so skip
# the per-visit 304 revalidation (which Safari 27 beta's rewritten HTTP cache
# mishandles for stylesheets) and cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"